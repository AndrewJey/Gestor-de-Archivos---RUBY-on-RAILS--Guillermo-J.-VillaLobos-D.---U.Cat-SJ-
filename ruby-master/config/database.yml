default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("PG_HOST", "localhost") %>
  port: <%= ENV.fetch("PG_PORT", 5432) %>
  username: <%= ENV.fetch("PG_USERNAME", "postgres") %>
  password: <%= ENV["PG_PASSWORD"] %>

development:
  <<: *default
  database: <%= ENV.fetch("PG_DATABASE", "proyecto") %>

test:
  <<: *default
  database: <%= ENV.fetch("PG_TEST_DATABASE", "proyecto_test") %>

production:
  <<: *default
  database: <%= ENV.fetch("PG_DATABASE", "proyecto_production") %>
